# Suppliers to scrape.  Add a new block per website.
#
#   id                 folder name under output/
#   manufacturer       used in image/PDF file names: MANUFACTURER-PRODUCT-001.jpg
#   listing_urls       catalogue / category pages to start from
#   official_domains   the MANUFACTURER's own domains (subdomains included).
#                      Images, brochures, manuals and YouTube links are taken ONLY
#                      from pages on these domains.
#   platform           auto | shopify | generic   (auto detects Shopify)
#   product_url_pattern regex for product page paths (optional; auto heuristic otherwise)
#   include / exclude  keep / drop products whose name or URL contains these words
#   product_urls       explicit product pages (added to whatever discovery finds)
#   downloads_pages    official "Downloads" pages; PDFs there are matched to products by model name

defaults:
  min_images: 3
  max_images: 5
  delay_seconds: 1.0
  max_listing_pages: 20

suppliers:
  - id: jacobs-mc
    manufacturer: Jacobs-MC
    listing_urls:
      - https://jacobs-mc.com/
      - https://jacobs-mc.co/
    official_domains: [jacobs-mc.com, jacobs-mc.co]
    include: [MultiPro, Lixener30, Sniffer430, Vister]   # MultiPro first: its URL may also contain "lixener"
    product_urls:
      - https://jacobs-mc.com/products/lixener30/
      - https://jacobs-mc.co/product-details/product/sniffer430-water-leak-detector

  - id: fotric
    manufacturer: FOTRIC
    listing_urls:
      - https://us.fotric.com/collections/all-products
    official_domains: [fotric.com]
    platform: shopify
    # "All thermal cameras": drop accessories. Review the list after the first run.
    exclude: [accessor, lens, battery, charger, tripod, cable, bag, software, license, mount, adapter]

  - id: riezler
    manufacturer: Riezler
    listing_urls:
      - https://www.riezler.eu/en/products/push-systems
    official_domains: [riezler.eu]
    product_url_pattern: "/en/products/push-systems/[^/]+"

  - id: mitcorp
    manufacturer: Mitcorp
    listing_urls:
      - https://www.mitcorp.com.tw/product-category/model-type/x-series/
    official_domains: [mitcorp.com.tw, mitcorpusa.com]
    product_url_pattern: "/product/[^/]+/?$"
    downloads_pages:
      - https://www.mitcorp.com.tw/downloads/
